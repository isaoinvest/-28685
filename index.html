<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>AR 影片展示</title>

  <!-- ── 設定區：只需修改這裡 ── -->
  <script>
  const AR_CONFIG = {
    targetJsonPaths: [
      './image-targets/LHZ.json'
    ],
    videoSrc: 'https://pub-ac80c6d0a305452bbe0bdfcec65b6a2c.r2.dev/28685.mp4',
    videoAspect: { w: 16, h: 9 },
    videoPlaneWidth: 1.6
  };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./external/xr/xr.js" data-preload-chunks="slam"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }
    #renderCanvas {
      position: fixed !important; top: 0 !important; left: 0 !important;
      width: 100vw !important; height: 100vh !important; z-index: 0;
    }
    [class*="xr8"], [id*="xr8"], [class*="poweredby"], [id*="powered"] {
      visibility: hidden !important; pointer-events: none !important;
    }

    /* ── 掃描引導 ── */
    #scan-ov {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      pointer-events: none; opacity: 1; transition: opacity .5s;
    }
    #scan-ov.hidden { opacity: 0; }
    .sbox {
      width: 220px; height: 220px; position: relative;
      border: 1.5px solid rgba(0,210,255,.3); border-radius: 12px;
    }
    .sline {
      position: absolute; height: 2px; width: 100%; top: 0;
      background: linear-gradient(90deg, transparent, #00eeff 30%, #00eeff 70%, transparent);
      animation: scan 2s ease-in-out infinite;
    }
    .corn { position: absolute; width: 20px; height: 20px; border-color: rgba(0,238,255,.9); border-style: solid; border-width: 0; }
    .c-tl { top:0;    left:0;  border-top-width:2.5px;    border-left-width:2.5px;   border-top-left-radius:5px; }
    .c-tr { top:0;    right:0; border-top-width:2.5px;    border-right-width:2.5px;  border-top-right-radius:5px; }
    .c-bl { bottom:0; left:0;  border-bottom-width:2.5px; border-left-width:2.5px;   border-bottom-left-radius:5px; }
    .c-br { bottom:0; right:0; border-bottom-width:2.5px; border-right-width:2.5px;  border-bottom-right-radius:5px; }
    #scan-label {
      font-family: monospace; font-size: 11px; letter-spacing: 2px;
      color: rgba(0,210,255,.7); text-align: center; line-height: 1.8;
    }

    /* ── 控制列 ── */
    #ctrl-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; z-index: 100;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,4,14,.92); border-top: 1px solid rgba(0,150,255,.2);
      opacity: 0; transition: opacity .4s; pointer-events: none;
    }
    #ctrl-bar.show { opacity: 1; pointer-events: auto; }
    .cb {
      height: 38px; padding: 0 20px; background: rgba(0,20,60,.8);
      border: 1px solid rgba(0,150,255,.35); border-radius: 20px;
      font-family: monospace; font-size: 12px; color: rgba(0,200,255,.9);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .cb:active { background: rgba(0,80,200,.5); }

    /* ── 錯誤訊息 ── */
    #err-msg {
      display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      background: rgba(0,4,16,.96); border: 1px solid rgba(255,80,80,.5);
      border-radius: 12px; padding: 20px 28px; text-align: center;
      font-family: monospace; font-size: 12px; color: rgba(255,120,120,.9);
      z-index: 9999; max-width: 80vw; line-height: 2;
    }

    @keyframes scan {
      0%   { top: 0;               opacity: 1;  }
      50%  { top: calc(100% - 2px); opacity: .7; }
      100% { top: 0;               opacity: 1;  }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%      { transform: scale(1.15); opacity: .75; }
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <div id="scan-ov">
    <div class="sbox">
      <div class="sline"></div>
      <div class="corn c-tl"></div><div class="corn c-tr"></div>
      <div class="corn c-bl"></div><div class="corn c-br"></div>
    </div>
    <div id="scan-label">AR READY<br>請對準目標圖像</div>
  </div>

  <div id="ctrl-bar">
    <button class="cb" id="btn-play">⏸ 暫停</button>
    <button class="cb" id="btn-mute">🔇 靜音</button>
  </div>

  <div id="err-msg"></div>

  <script>
  // ── 錯誤顯示 ──
  function showError(msg) {
    const el = document.getElementById('err-msg');
    el.innerHTML = msg;
    el.style.display = 'block';
    document.getElementById('scan-ov').classList.add('hidden');
    console.error('[AR]', msg);
  }

  // =====================================================
  //  AR 影片 Pipeline Module
  // =====================================================
  function mkVideoModule(targetNames) {
    let videoGroup, videoEl, videoTex;
    let playing = false, hasInteracted = false;

    const scanEl  = document.getElementById('scan-ov');
    const ctrlBar = document.getElementById('ctrl-bar');
    const btnPlay = document.getElementById('btn-play');
    const btnMute = document.getElementById('btn-mute');

    function play() {
      videoEl.play().then(() => {
        playing = true; hasInteracted = true;
        btnPlay.textContent = '⏸ 暫停';
      }).catch(e => console.warn('[AR] play() blocked:', e));
    }

    function pause() {
      videoEl.pause();
      playing = false;
      btnPlay.textContent = '▶ 播放';
    }

    function showVideo(detail) {
      videoGroup.position.copy(detail.position);
      videoGroup.quaternion.copy(detail.rotation);
      videoGroup.scale.setScalar(detail.scale);
      videoGroup.visible = true;
      scanEl.classList.add('hidden');
      ctrlBar.classList.add('show');
      if (!hasInteracted) play();
    }

    function hideVideo() {
      if (videoGroup) videoGroup.visible = false;
      pause();
      ctrlBar.classList.remove('show');
      scanEl.classList.remove('hidden');
    }

    return {
      name: 'ar-video',

      onStart() {
        const { scene, renderer } = XR8.Threejs.xrScene();
        renderer.autoClear = false;
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        scene.add(new THREE.AmbientLight(0xffffff, 1));

        // 建立影片元素
        videoEl = document.createElement('video');
        videoEl.src = AR_CONFIG.videoSrc;
        videoEl.loop = true;
        videoEl.muted = true;
        videoEl.playsInline = true;
        videoEl.crossOrigin = 'anonymous';
        videoEl.load();

        // 建立影片平面
        const pw = AR_CONFIG.videoPlaneWidth;
        const ph = pw * (AR_CONFIG.videoAspect.h / AR_CONFIG.videoAspect.w);
        videoTex = new THREE.VideoTexture(videoEl);
        videoTex.minFilter = videoTex.magFilter = THREE.LinearFilter;

        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(pw, ph),
          new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.DoubleSide })
        );
        videoGroup = new THREE.Group();
        videoGroup.visible = false;
        videoGroup.add(mesh);
        scene.add(videoGroup);

        // 控制按鈕
        btnPlay.addEventListener('click', () => playing ? pause() : play());
        btnMute.addEventListener('click', () => {
          videoEl.muted = !videoEl.muted;
          btnMute.textContent = videoEl.muted ? '🔇 靜音' : '🔊 聲音';
        });
      },

      onUpdate() {
        if (videoTex && playing) videoTex.needsUpdate = true;
      },

      listeners: [
        {
          event: 'reality.imagefound',
          process({ detail }) {
            // 接受任何已知目標，或若 targetNames 為空則接受所有
            if (targetNames.size > 0 && !targetNames.has(detail.name)) return;
            console.log('[AR] imagefound:', detail.name);
            showVideo(detail);
          }
        },
        {
          event: 'reality.imageupdated',
          process({ detail }) {
            if (!videoGroup?.visible) return;
            if (targetNames.size > 0 && !targetNames.has(detail.name)) return;
            videoGroup.position.copy(detail.position);
            videoGroup.quaternion.copy(detail.rotation);
            videoGroup.scale.setScalar(detail.scale);
          }
        },
        {
          event: 'reality.imagelost',
          process({ detail }) {
            if (targetNames.size > 0 && !targetNames.has(detail.name)) return;
            console.log('[AR] imagelost:', detail.name);
            hideVideo();
          }
        }
      ]
    };
  }

  // =====================================================
  //  核心啟動：正確的 XR8 初始化順序
  //
  //  ✅ 正確順序：
  //    1. 預先 fetch JSON（與 xrloaded 同步進行）
  //    2. xrloaded 觸發後 → configure → addCameraPipelineModules → run
  //
  //  ❌ 錯誤做法（原代碼的問題）：
  //    - 在 async 函式裡 await 等待，導致 configure() 在
  //      xrloaded 之後很久才被呼叫，XR8 狀態已改變
  // =====================================================
  let _xrReady = false;
  let _targetJsons = null;   // 完整 JSON 物件陣列（傳給 imageTargetData）
  let _targetNames = null;   // 目標名稱 Set（傳給 pipeline module 做事件過濾）

  // Step 1：背景預載 JSON（不阻塞 xrloaded）
  async function prefetchTargets() {
    const jsons = [];
    const names = new Set();

    for (const path of AR_CONFIG.targetJsonPaths) {
      try {
        const r = await fetch(path);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const json = await r.json();
        jsons.push(json);

        // 嘗試從多種可能的欄位讀取名稱（兼容不同版本的 JSON 格式）
        const name = json.name ?? json.targetName ?? json.imageName;
        if (name) names.add(name);

        console.log('[AR] target loaded:', path, '→ name:', name ?? '(unknown)');
      } catch (e) {
        console.error('[AR] failed to load target:', path, e);
      }
    }

    _targetJsons = jsons;
    _targetNames = names;
    console.log('[AR] targets ready. names:', [...names]);

    tryStartXR();
  }

  // Step 2：xrloaded 後觸發
  function onXrLoaded() {
    _xrReady = true;
    console.log('[AR] xrloaded');
    tryStartXR();
  }

  // Step 3：兩者都就緒才真正啟動（無須 polling loop）
  function tryStartXR() {
    if (!_xrReady || _targetJsons === null) return;  // 等另一方

    if (_targetJsons.length === 0) {
      showError('❌ 無法載入影像目標 JSON<br>請確認 ./image-targets/LHZ.json 路徑正確');
      return;
    }

    console.log('[AR] starting XR8 with', _targetJsons.length, 'target(s)');

    // ✅ configure 必須在 xrloaded 之後、run 之前同步呼叫
    XR8.XrController.configure({
      disableWorldTracking: true,
      imageTargetData: _targetJsons      // 傳完整 JSON 物件
    });

    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.Threejs.pipelineModule(),
      XR8.XrController.pipelineModule(),
      mkVideoModule(_targetNames)
    ]);

    XR8.run({ canvas: document.getElementById('renderCanvas') });
  }

  // ── 啟動 Overlay（單次點擊，觸發相機 / 陀螺儀權限）──
  ;(function initOverlay() {
    const overlay = document.createElement('div');
    Object.assign(overlay.style, {
      position:'fixed', top:0, left:0, width:'100%', height:'100%',
      zIndex:9999, display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', gap:'18px',
      background:'rgba(0,4,16,.96)', cursor:'pointer'
    });
    overlay.innerHTML = `
      <div style="font-size:52px;animation:pulse 2s infinite">📽️</div>
      <div style="font-family:monospace;font-size:13px;letter-spacing:3px;
                  color:rgba(0,200,255,.85);text-align:center;line-height:2">
        AR VIDEO<br>
        <span style="font-size:11px;opacity:.55">TAP TO START</span>
      </div>`;

    overlay.addEventListener('click', async () => {
      overlay.remove();
      try {
        if (DeviceMotionEvent?.requestPermission)
          await DeviceMotionEvent.requestPermission();
        if (DeviceOrientationEvent?.requestPermission)
          await DeviceOrientationEvent.requestPermission();
      } catch(e) {}

      // 同時啟動兩個並行流程
      window.addEventListener('xrloaded', onXrLoaded);
      // 若 XR8 已在 script 載入時就觸發過 xrloaded，直接呼叫
      if (typeof XR8 !== 'undefined') onXrLoaded();

      prefetchTargets();
    }, { once: true });

    document.body.appendChild(overlay);
  })();
  </script>
</body>
</html>
