<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>AR Video</title>

  <script>
    const AR_CONFIG = {
      targetJsonPaths: ['./image-targets/LHZ.json'],
      videoSrc: 'https://pub-ac80c6d0a305452bbe0bdfcec65b6a2c.r2.dev/28685.mp4',
      videoAspect: { w: 16, h: 9 },
      videoPlaneWidth: 1.6
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./external/xr/xr.js" data-preload-chunks="slam"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
      position: fixed;
      inset: 0;
      font-family: monospace;
    }

    #renderCanvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 0;
      object-fit: cover;
    }

    [class*='xr8'],
    [id*='xr8'],
    [class*='watermark'],
    [id*='watermark'],
    [class*='poweredby'] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #tap-start {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transition: opacity 0.7s ease;
      -webkit-tap-highlight-color: transparent;
    }

    #tap-start .title {
      color: #00d8ff;
      font-size: 13px;
      letter-spacing: 3px;
      line-height: 2;
      text-align: center;
    }

    #ts-loader {
      display: none;
      color: #00d8ff;
      font-size: 11px;
    }

    #ts-loader.on {
      display: block;
    }

    #scan-ov {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #scan-ov.hidden {
      opacity: 0;
    }

    .sbox {
      width: 220px;
      height: 220px;
      border: 2px solid rgba(0, 220, 255, 0.45);
      border-radius: 12px;
    }

    #scan-label {
      color: #00d8ff;
      font-size: 11px;
      text-align: center;
      line-height: 1.8;
    }

    #ctrl-bar {
      position: fixed;
      inset: auto 0 0 0;
      height: 60px;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #ctrl-bar.show {
      opacity: 1;
      pointer-events: auto;
    }

    .cb {
      height: 38px;
      padding: 0 20px;
      border: none;
      border-radius: 20px;
      background: #00172d;
      border: 1px solid rgba(0, 180, 255, 0.35);
      color: #00d8ff;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="scan-ov">
    <div class="sbox"></div>
    <div id="scan-label">AR READY<br />請對準目標圖像</div>
  </div>

  <div id="ctrl-bar">
    <button class="cb" id="btn-play">⏸ 暫停</button>
  </div>

  <div id="tap-start">
    <div class="title">
      AR VIDEO<br />
      TAP TO START
    </div>
    <div id="ts-loader">啟動中...</div>
  </div>

  <script>
    const STATE = {
      targets: null,
      xrReady: false,
      booted: false,
      resizeBound: false
    };

    const UI = {
      tap: document.getElementById('tap-start'),
      loader: document.getElementById('ts-loader'),
      scan: document.getElementById('scan-ov'),
      ctrl: document.getElementById('ctrl-bar'),
      playBtn: document.getElementById('btn-play'),
      canvas: document.getElementById('renderCanvas')
    };

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function waitUntil(fn, timeout = 10000, interval = 200) {
      let waited = 0;

      while (!fn() && waited < timeout) {
        await wait(interval);
        waited += interval;
      }

      return fn();
    }

    function createVideo() {
      const v = document.createElement('video');
      v.src = AR_CONFIG.videoSrc;
      v.loop = true;
      v.muted = false;
      v.playsInline = true;
      v.crossOrigin = 'anonymous';
      v.preload = 'auto';
      v.setAttribute('playsinline', '');
      v.setAttribute('webkit-playsinline', '');
      return v;
    }

    async function preloadTargets() {
      const result = [];

      for (const path of AR_CONFIG.targetJsonPaths) {
        try {
          const res = await fetch(path);
          result.push(await res.json());
        } catch (e) {
          console.error(e);
        }
      }

      STATE.targets = result;
    }

    async function reqPermissions() {
      try {
        if (
          typeof DeviceMotionEvent !== 'undefined' &&
          typeof DeviceMotionEvent.requestPermission === 'function'
        ) {
          await DeviceMotionEvent.requestPermission();
        }

        if (
          typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function'
        ) {
          await DeviceOrientationEvent.requestPermission();
        }
      } catch (e) {}
    }

    function createARModule() {
      let video;
      let texture;
      let group;
      let playing = false;

      function resizeRenderer() {
        const { renderer, camera } = XR8.Threejs.xrScene();

        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(window.innerWidth, window.innerHeight, false);

        renderer.domElement.style.cssText = `
          position: fixed !important;
          inset: 0 !important;
          width: 100vw !important;
          height: 100vh !important;
          z-index: 0 !important;
          object-fit: cover !important;
        `;

        if (camera) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
        }
      }

      async function setPlayback(shouldPlay) {
        if (shouldPlay) {
          await video.play().catch(console.warn);
          playing = true;
          UI.playBtn.textContent = '⏸ 暫停';
        } else {
          video.pause();
          playing = false;
          UI.playBtn.textContent = '▶ 播放';
        }
      }

      return {
        name: 'ar-video-module',

        onStart() {
          const { scene, renderer } = XR8.Threejs.xrScene();

          renderer.autoClear = false;

          resizeRenderer();

          if (!STATE.resizeBound) {
            STATE.resizeBound = true;

            window.addEventListener('resize', resizeRenderer);
            window.addEventListener('orientationchange', () => {
              setTimeout(resizeRenderer, 300);
            });
          }

          scene.add(new THREE.AmbientLight(0xffffff, 1));

          video = createVideo();
          texture = new THREE.VideoTexture(video);
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          const w = AR_CONFIG.videoPlaneWidth;
          const h = w * (AR_CONFIG.videoAspect.h / AR_CONFIG.videoAspect.w);

          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
              map: texture,
              side: THREE.DoubleSide,
              toneMapped: false
            })
          );

          group = new THREE.Group();
          group.visible = false;
          group.add(mesh);

          scene.add(group);

          UI.playBtn.onclick = () => setPlayback(!playing);
        },

        onUpdate() {
          if (playing && texture) {
            texture.needsUpdate = true;
          }
        },

        listeners: [
          {
            event: 'reality.imagefound',
            process: async ({ detail }) => {
              group.position.copy(detail.position);
              group.quaternion.copy(detail.rotation);
              group.scale.setScalar(detail.scale);

              group.visible = true;
              UI.scan.classList.add('hidden');
              UI.ctrl.classList.add('show');

              await setPlayback(true);
            }
          },
          {
            event: 'reality.imageupdated',
            process: ({ detail }) => {
              if (!group.visible) return;

              group.position.copy(detail.position);
              group.quaternion.copy(detail.rotation);
              group.scale.setScalar(detail.scale);
            }
          },
          {
            event: 'reality.imagelost',
            process: async () => {
              group.visible = false;
              UI.scan.classList.remove('hidden');
              UI.ctrl.classList.remove('show');

              await setPlayback(false);
            }
          }
        ]
      };
    }

    async function startXR8() {
      const targetsReady = await waitUntil(() => STATE.targets);
      const xrReady = await waitUntil(() => STATE.xrReady);

      if (!targetsReady || !xrReady) {
        UI.loader.innerHTML = `
          載入失敗<br>
          請確認 HTTPS / 相機權限 / 網路
        `;
        return;
      }

      XR8.XrController.configure({
        disableWorldTracking: true,
        imageTargetData: STATE.targets
      });

      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
        createARModule()
      ]);

      XR8.run({
        canvas: UI.canvas
      });
    }

    async function boot() {
      if (STATE.booted) return;
      STATE.booted = true;

      UI.loader.classList.add('on');

      await reqPermissions();

      UI.tap.style.opacity = '0';

      setTimeout(() => {
        UI.tap.style.display = 'none';
      }, 700);

      await startXR8();
    }

    window.addEventListener('xrloaded', () => {
      STATE.xrReady = true;
    });

    UI.tap.addEventListener('click', boot);
    UI.tap.addEventListener(
      'touchend',
      e => {
        e.preventDefault();
        boot();
      },
      { passive: false }
    );

    window.addEventListener('load', preloadTargets);
  </script>
</body>
</html>
