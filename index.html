<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>AR Video - Optimized</title>

  <script>
    const AR_CONFIG = {
      targetJsonPaths: ['./image-targets/LHZ.json'],
      videoSrc: 'https://pub-ac80c6d0a305452bbe0bdfcec65b6a2c.r2.dev/28685.mp4',
      videoAspect: { w: 16, h: 9 },
      videoPlaneWidth: 1.6 // 這是相對於識別圖寬度的倍率
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./external/xr/xr.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; height: 100%; overflow: hidden; 
      background: #000; position: fixed; 
    }

    /* 修正畫布容器 */
    #renderCanvas {
      position: fixed !important;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* 隱藏官方浮水印（請注意授權規範） */
    .xr8-watermark, #poweredby-img { display: none !important; }

    #tap-start {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.9);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      transition: opacity .5s;
    }

    .title { color: #00d8ff; font-family: monospace; letter-spacing: 2px; text-align: center; }
    
    #scan-ov {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      pointer-events: none; transition: opacity .3s;
    }
    .sbox {
      width: 240px; height: 240px;
      border: 2px solid #00d8ff; border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,216,255,0.5);
    }
    .hidden { opacity: 0; }

    #ctrl-bar {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%); z-index: 100;
      display: none;
    }
    #ctrl-bar.show { display: block; }
    .cb {
      padding: 10px 25px; border-radius: 25px;
      background: #00172d; border: 1px solid #00d8ff;
      color: #00d8ff; cursor: pointer;
    }
  </style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="scan-ov">
  <div class="sbox"></div>
  <p id="scan-label" style="color:#00d8ff; margin-top:15px;">請對準識別圖</p>
</div>

<div id="ctrl-bar">
  <button class="cb" id="btn-play">⏸ 暫停</button>
</div>

<div id="tap-start">
  <div class="title">AR VIDEO PROJECT<br>點擊螢幕開始</div>
  <div id="ts-loader" style="color:#aaa; font-size:12px; margin-top:10px;">等待載入...</div>
</div>

<script>
let _targets = null;
let _xrReady = false;

// 1. 預載入識別圖
async function preloadTargets() {
  const arr = [];
  for (const path of AR_CONFIG.targetJsonPaths) {
    try {
      const res = await fetch(path);
      const json = await res.json();
      arr.push(json);
    } catch (e) { console.error("圖檔載入失敗:", e); }
  }
  _targets = arr;
  document.getElementById('ts-loader').textContent = "資源已就緒";
}

// 2. 建立 AR 邏輯模組
const createARVideoModule = () => {
  let video, texture, mesh, group;
  const scan = document.getElementById('scan-ov');
  const ctrl = document.getElementById('ctrl-bar');
  const btn = document.getElementById('btn-play');

  return {
    name: 'ar-video-logic',
    onStart() {
      const { scene } = XR8.Threejs.xrScene();

      // 初始化影片物件
      video = document.createElement('video');
      video.src = AR_CONFIG.videoSrc;
      video.crossOrigin = 'anonymous';
      video.setAttribute('webkit-playsinline', 'true');
      video.setAttribute('playsinline', 'true');
      video.loop = true;

      texture = new THREE.VideoTexture(video);
      
      const w = AR_CONFIG.videoPlaneWidth;
      const h = w * (AR_CONFIG.videoAspect.h / AR_CONFIG.videoAspect.w);

      group = new THREE.Group();
      mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
      );
      
      // 旋轉平面使其與識別圖平行（XR8 預設平面通常需要旋轉）
      mesh.rotation.x = -Math.PI / 2; 
      
      group.add(mesh);
      group.visible = false;
      scene.add(group);

      btn.onclick = () => {
        if (video.paused) {
          video.play();
          btn.textContent = '⏸ 暫停';
        } else {
          video.pause();
          btn.textContent = '▶ 播放';
        }
      };
    },
    listeners: [
      {
        event: 'reality.imagefound',
        process({ detail }) {
          group.position.copy(detail.position);
          group.quaternion.copy(detail.rotation);
          group.scale.setScalar(detail.scale);
          group.visible = true;
          scan.classList.add('hidden');
          ctrl.classList.add('show');
          video.play().catch(e => console.warn("播放被阻擋:", e));
        }
      },
      {
        event: 'reality.imageupdated',
        process({ detail }) {
          group.position.copy(detail.position);
          group.quaternion.copy(detail.rotation);
          group.scale.setScalar(detail.scale);
        }
      },
      {
        event: 'reality.imagelost',
        process() {
          group.visible = false;
          scan.classList.remove('hidden');
          ctrl.classList.remove('show');
          video.pause();
        }
      }
    ]
  };
};

// 3. 啟動主程式
async function boot() {
  const tapStart = document.getElementById('tap-start');
  tapStart.style.opacity = '0';
  setTimeout(() => tapStart.style.display = 'none', 500);

  // 請求權限（iOS 必備）
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
    await DeviceOrientationEvent.requestPermission();
  }

  XR8.XrController.configure({ 
    disableWorldTracking: true, // 僅使用影像追蹤，節省效能
    imageTargetData: _targets 
  });

  XR8.addCameraPipelineModules([
    XR8.GlTextureRenderer.pipelineModule(),
    XR8.Threejs.pipelineModule(),
    XR8.XrController.pipelineModule(),
    createARVideoModule()
  ]);

  XR8.run({ canvas: document.getElementById('renderCanvas') });
}

window.addEventListener('load', preloadTargets);
window.addEventListener('xrloaded', () => { _xrReady = true; });
document.getElementById('tap-start').addEventListener('click', boot);
</script>

</body>
</html>
