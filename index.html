<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>AR 影片展示</title>

  <!-- ══════════════════════════════════════
       設定區：只需修改這裡
  ══════════════════════════════════════ -->
  <script>
  const AR_CONFIG = {
    targetJsonPaths: ['./image-targets/LHZ.json'],
    videoSrc:        'https://pub-ac80c6d0a305452bbe0bdfcec65b6a2c.r2.dev/28685.mp4',
    videoAspect:     { w: 16, h: 9 },
    videoPlaneWidth: 1.6
  };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!--
    async 是必要的：讓 xr.js 在背景載入，不阻塞頁面渲染
    data-preload-chunks="slam" 讓 Image Targets 用到的 SLAM chunk 提早下載
  -->
  <script async src="./external/xr/xr.js" data-preload-chunks="slam"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: none; }

    /* XR8 自己管理 canvas 尺寸，這裡只讓它鋪滿即可，不要用 !important 覆蓋 */
    #camerafeed { display: block; width: 100vw; height: 100vh; }

    [class*="xr8"], [id*="xr8"], [class*="poweredby"], [id*="powered"] {
      visibility: hidden !important; pointer-events: none !important;
    }

    #scan-ov {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      pointer-events: none; opacity: 1; transition: opacity .5s;
    }
    #scan-ov.hidden { opacity: 0; }
    .sbox { width: 220px; height: 220px; position: relative; border: 1.5px solid rgba(0,210,255,.3); border-radius: 12px; }
    .sline {
      position: absolute; height: 2px; width: 100%; top: 0;
      background: linear-gradient(90deg, transparent, #00eeff 30%, #00eeff 70%, transparent);
      animation: scan 2s ease-in-out infinite;
    }
    .corn { position: absolute; width: 20px; height: 20px; border-color: rgba(0,238,255,.9); border-style: solid; border-width: 0; }
    .c-tl { top:0;    left:0;  border-top-width:2.5px; border-left-width:2.5px;   border-top-left-radius:5px; }
    .c-tr { top:0;    right:0; border-top-width:2.5px; border-right-width:2.5px;  border-top-right-radius:5px; }
    .c-bl { bottom:0; left:0;  border-bottom-width:2.5px; border-left-width:2.5px;  border-bottom-left-radius:5px; }
    .c-br { bottom:0; right:0; border-bottom-width:2.5px; border-right-width:2.5px; border-bottom-right-radius:5px; }
    #scan-label { font-family: monospace; font-size: 11px; letter-spacing: 2px; color: rgba(0,210,255,.7); text-align: center; line-height: 1.8; }

    #ctrl-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 60px; z-index: 100;
      display: flex; align-items: center; justify-content: center; gap: 14px;
      background: rgba(0,4,14,.92); border-top: 1px solid rgba(0,150,255,.2);
      opacity: 0; transition: opacity .4s; pointer-events: none;
    }
    #ctrl-bar.show { opacity: 1; pointer-events: auto; }
    .cb {
      height: 38px; padding: 0 20px; background: rgba(0,20,60,.8);
      border: 1px solid rgba(0,150,255,.35); border-radius: 20px;
      font-family: monospace; font-size: 12px; color: rgba(0,200,255,.9);
      cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .cb:active { background: rgba(0,80,200,.5); }

    #start-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: rgba(0,4,16,.96); cursor: pointer;
    }

    @keyframes scan {
      0%   { top: 0;               opacity: 1;  }
      50%  { top: calc(100% - 2px); opacity: .7; }
      100% { top: 0;               opacity: 1;  }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1);    opacity: 1;   }
      50%      { transform: scale(1.15); opacity: .75; }
    }
  </style>
</head>
<body>

  <canvas id="camerafeed"></canvas>

  <div id="scan-ov">
    <div class="sbox">
      <div class="sline"></div>
      <div class="corn c-tl"></div><div class="corn c-tr"></div>
      <div class="corn c-bl"></div><div class="corn c-br"></div>
    </div>
    <div id="scan-label">AR READY<br>請對準目標圖像</div>
  </div>

  <div id="ctrl-bar">
    <button class="cb" id="btn-play">⏸ 暫停</button>
    <button class="cb" id="btn-mute">🔇 靜音</button>
  </div>

  <div id="start-overlay">
    <div style="font-size:52px;animation:pulse 2s infinite">📽️</div>
    <div style="font-family:monospace;font-size:13px;letter-spacing:3px;color:rgba(0,200,255,.85);text-align:center;line-height:2">
      AR VIDEO<br><span style="font-size:11px;opacity:.55">TAP TO START</span>
    </div>
  </div>

  <script>
  // ══════════════════════════════════════════════════════════
  //  AR 影片 Pipeline Module
  // ══════════════════════════════════════════════════════════
  function makeVideoModule(knownNames) {
    let videoGroup, videoEl, videoTex;
    let playing = false, hasInteracted = false;

    const scanEl  = document.getElementById('scan-ov');
    const ctrlBar = document.getElementById('ctrl-bar');
    const btnPlay = document.getElementById('btn-play');
    const btnMute = document.getElementById('btn-mute');

    function isOurs(name) {
      return knownNames.size === 0 || knownNames.has(name);
    }

    function doPlay() {
      videoEl.play().then(() => {
        playing = true; hasInteracted = true;
        btnPlay.textContent = '⏸ 暫停';
      }).catch(e => console.warn('[AR] play blocked:', e));
    }

    function doPause() {
      videoEl.pause(); playing = false;
      btnPlay.textContent = '▶ 播放';
    }

    function showVideo(d) {
      videoGroup.position.copy(d.position);
      videoGroup.quaternion.copy(d.rotation);
      videoGroup.scale.setScalar(d.scale);
      videoGroup.visible = true;
      scanEl.classList.add('hidden');
      ctrlBar.classList.add('show');
      if (!hasInteracted) doPlay();
    }

    function hideVideo() {
      if (videoGroup) videoGroup.visible = false;
      doPause();
      ctrlBar.classList.remove('show');
      scanEl.classList.remove('hidden');
    }

    return {
      name: 'ar-video-module',

      onStart() {
        const { scene, renderer } = XR8.Threejs.xrScene();

        // ✅ 只設 autoClear = false，讓 GlTextureRenderer 的相機畫面不被清除
        //    絕對不要呼叫 renderer.setSize() 或 renderer.setPixelRatio()
        //    那會破壞 XR8 對 canvas 的內部控制
        renderer.autoClear = false;

        // 建立影片元素
        videoEl = document.createElement('video');
        videoEl.src         = AR_CONFIG.videoSrc;
        videoEl.loop        = true;
        videoEl.muted       = true;
        videoEl.playsInline = true;
        videoEl.crossOrigin = 'anonymous';
        videoEl.load();

        // 建立影片平面
        const pw = AR_CONFIG.videoPlaneWidth;
        const ph = pw * (AR_CONFIG.videoAspect.h / AR_CONFIG.videoAspect.w);
        videoTex = new THREE.VideoTexture(videoEl);
        videoTex.minFilter = videoTex.magFilter = THREE.LinearFilter;

        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(pw, ph),
          new THREE.MeshBasicMaterial({ map: videoTex, side: THREE.DoubleSide })
        );
        videoGroup = new THREE.Group();
        videoGroup.visible = false;
        videoGroup.add(mesh);
        scene.add(videoGroup);

        btnPlay.addEventListener('click', () => playing ? doPause() : doPlay());
        btnMute.addEventListener('click', () => {
          videoEl.muted = !videoEl.muted;
          btnMute.textContent = videoEl.muted ? '🔇 靜音' : '🔊 聲音';
        });
      },

      onUpdate() {
        if (videoTex && playing) videoTex.needsUpdate = true;
      },

      listeners: [
        { event: 'reality.imagefound',   process({ detail }) { if (isOurs(detail.name)) showVideo(detail); } },
        { event: 'reality.imageupdated', process({ detail }) {
            if (!isOurs(detail.name) || !videoGroup?.visible) return;
            videoGroup.position.copy(detail.position);
            videoGroup.quaternion.copy(detail.rotation);
            videoGroup.scale.setScalar(detail.scale);
        }},
        { event: 'reality.imagelost',    process({ detail }) { if (isOurs(detail.name)) hideVideo(); } }
      ]
    };
  }

  // ══════════════════════════════════════════════════════════
  //  啟動流程
  //
  //  正確的 8th Wall 啟動時序（官方文件規定）：
  //
  //    xrloaded 事件觸發
  //      └─ XR8.XrController.configure()        ← 必須第一步
  //      └─ XR8.addCameraPipelineModules([
  //              GlTextureRenderer,              ← 畫相機，必須最先裝
  //              Threejs,
  //              XrController,
  //              自訂模組
  //         ])
  //      └─ XR8.run({ canvas })
  //
  //  我們用三個旗標確保：使用者點擊 + xrloaded + JSON 載完
  //  三者都就緒才執行上述流程，且不使用 async polling loop
  // ══════════════════════════════════════════════════════════

  let _targetJsons = null;
  let _targetNames = new Set();
  let _clicked = false;
  let _xrReady = false;

  async function prefetchTargets() {
    const jsons = [];
    for (const path of AR_CONFIG.targetJsonPaths) {
      try {
        const r = await fetch(path);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const json = await r.json();
        jsons.push(json);
        const n = json.name ?? json.targetName ?? json.imageName;
        if (n) _targetNames.add(n);
        console.log('[AR] loaded target:', path, 'name:', n ?? '(none)');
      } catch(e) {
        console.error('[AR] failed to load target:', e.message);
      }
    }
    _targetJsons = jsons;
    maybeStart();
  }

  function onXrLoaded() {
    _xrReady = true;
    console.log('[AR] xrloaded ✓');
    maybeStart();
  }

  async function onUserClick() {
    document.getElementById('start-overlay').remove();
    try {
      if (typeof DeviceMotionEvent?.requestPermission === 'function')
        await DeviceMotionEvent.requestPermission();
      if (typeof DeviceOrientationEvent?.requestPermission === 'function')
        await DeviceOrientationEvent.requestPermission();
    } catch(e) {}
    _clicked = true;
    console.log('[AR] user clicked ✓');
    maybeStart();
  }

  function maybeStart() {
    if (!_clicked || !_xrReady || _targetJsons === null) return;

    if (_targetJsons.length === 0) {
      document.getElementById('scan-label').innerHTML =
        '❌ 無法載入影像目標<br>請確認 LHZ.json 路徑';
      return;
    }

    console.log('[AR] all ready → starting XR8');

    // 步驟 1：configure（必須在 addCameraPipelineModules 之前）
    XR8.XrController.configure({
      disableWorldTracking: true,
      imageTargetData: _targetJsons
    });

    // 步驟 2：安裝 pipeline modules（順序重要！）
    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),  // ← 相機畫面，必須第一
      XR8.Threejs.pipelineModule(),            // ← three.js 場景
      XR8.XrController.pipelineModule(),       // ← 追蹤 + 圖像辨識
      makeVideoModule(_targetNames)            // ← 自訂影片邏輯
    ]);

    // 步驟 3：啟動相機
    XR8.run({ canvas: document.getElementById('camerafeed') });
  }

  // 初始化
  document.getElementById('start-overlay')
    .addEventListener('click', onUserClick, { once: true });

  // xrloaded 可能在我們綁定之前就已觸發（若 xr.js 快速載入）
  if (typeof XR8 !== 'undefined') {
    onXrLoaded();
  } else {
    window.addEventListener('xrloaded', onXrLoaded);
  }

  // 預先下載 JSON（不等使用者點擊）
  prefetchTargets();
  </script>
</body>
</html>
