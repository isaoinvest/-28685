<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>AR Video</title>

  <!-- ════ 設定區 ════ -->
  <script>
  const AR_CONFIG = {
    targetJsonPaths: ['./image-targets/LHZ.json'],
    videoSrc:        'https://pub-ac80c6d0a305452bbe0bdfcec65b6a2c.r2.dev/28685.mp4',
    videoAspect:     { w: 16, h: 9 },
    videoPlaneWidth: 1.6
  };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="./external/xr/xr.js" data-preload-chunks="slam"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: #000;
      touch-action: none;
      position: fixed; inset: 0;
      font-family: monospace;
    }

    #renderCanvas {
      position: fixed !important; inset: 0 !important;
      width: 100vw !important; height: 100vh !important;
      z-index: 0; object-fit: cover;
    }

    /* 隱藏 8th Wall 浮水印 */
    [class*="xr8"], [id*="xr8"],
    [class*="watermark"], [id*="watermark"],
    [class*="poweredby"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* ── TAP TO START ── */
    #tap-start {
      position: fixed; inset: 0; z-index: 9999;
      background: #000;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 20px;
      transition: opacity 0.7s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    #tap-start .title {
      color: #00d8ff; font-size: 13px;
      letter-spacing: 3px; line-height: 2; text-align: center;
    }
    #ts-loader { display: none; color: #00d8ff; font-size: 11px; }
    #ts-loader.on { display: block; }

    /* ── 掃描框 ── */
    #scan-ov {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 20px;
      pointer-events: none; transition: opacity 0.4s;
    }
    #scan-ov.hidden { opacity: 0; }
    .sbox {
      width: 220px; height: 220px; position: relative;
      border: 1.5px solid rgba(0,220,255,.4); border-radius: 12px;
    }
    .sline {
      position: absolute; height: 2px; width: 100%; top: 0;
      background: linear-gradient(90deg, transparent, #00eeff 30%, #00eeff 70%, transparent);
      animation: scan 2s ease-in-out infinite;
    }
    .corn {
      position: absolute; width: 18px; height: 18px;
      border-color: #00eeff; border-style: solid; border-width: 0;
    }
    .c-tl { top:0;    left:0;  border-top-width:2px; border-left-width:2px;   border-top-left-radius:4px; }
    .c-tr { top:0;    right:0; border-top-width:2px; border-right-width:2px;  border-top-right-radius:4px; }
    .c-bl { bottom:0; left:0;  border-bottom-width:2px; border-left-width:2px;  border-bottom-left-radius:4px; }
    .c-br { bottom:0; right:0; border-bottom-width:2px; border-right-width:2px; border-bottom-right-radius:4px; }
    #scan-label { color: #00d8ff; font-size: 11px; text-align: center; line-height: 1.8; }

    /* ── 控制列 ── */
    #ctrl-bar {
      position: fixed; inset: auto 0 0 0; height: 60px; z-index: 100;
      display: flex; justify-content: center; align-items: center;
      background: rgba(0,0,0,.85);
      opacity: 0; pointer-events: none; transition: opacity 0.4s;
    }
    #ctrl-bar.show { opacity: 1; pointer-events: auto; }
    .cb {
      height: 38px; padding: 0 28px;
      background: #00172d; border: 1px solid rgba(0,180,255,.35);
      border-radius: 20px; color: #00d8ff; font-size: 12px;
      font-family: monospace; cursor: pointer;
    }
    .cb:active { background: rgba(0,80,200,.5); }

    @keyframes scan {
      0%,100% { top: 0;               opacity: 1;  }
      50%      { top: calc(100% - 2px); opacity: .6; }
    }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <div id="scan-ov">
    <div class="sbox">
      <div class="sline"></div>
      <div class="corn c-tl"></div><div class="corn c-tr"></div>
      <div class="corn c-bl"></div><div class="corn c-br"></div>
    </div>
    <div id="scan-label">AR READY<br>請對準目標圖像</div>
  </div>

  <div id="ctrl-bar">
    <button class="cb" id="btn-play">⏸ 暫停</button>
  </div>

  <div id="tap-start">
    <div class="title">AR VIDEO<br>TAP TO START</div>
    <div id="ts-loader">啟動中...</div>
  </div>

  <script>
  // ── UI 元素快取 ──
  const UI = {
    tap:     document.getElementById('tap-start'),
    loader:  document.getElementById('ts-loader'),
    scan:    document.getElementById('scan-ov'),
    ctrl:    document.getElementById('ctrl-bar'),
    playBtn: document.getElementById('btn-play'),
    canvas:  document.getElementById('renderCanvas')
  };

  // ── 全域狀態 ──
  const STATE = { targets: null, xrReady: false, booted: false };

  // ── 工具函式 ──
  const wait = ms => new Promise(r => setTimeout(r, ms));

  // [改進 #2] polling 縮短至 50ms，減少等待 JSON/xrReady 的空窗期
  const waitUntil = (fn, timeout = 10000) => new Promise(resolve => {
    const iv = setInterval(() => { if (fn()) { clearInterval(iv); resolve(true); } }, 50);
    setTimeout(() => { clearInterval(iv); resolve(fn()); }, timeout);
  });

  // ══════════════════════════════════════════════════════════
  //  [改進 #1] 盡早建立 Video 元素，頁面 load 後立即開始緩衝
  //  不需等使用者點擊，讓瀏覽器在背景下載影片資料
  // ══════════════════════════════════════════════════════════
  let earlyVideo = null;

  function createEarlyVideo() {
    const v = document.createElement('video');
    v.src         = AR_CONFIG.videoSrc;
    v.loop        = true;
    v.muted       = true;          // 預緩衝階段必須 muted，否則 iOS 不允許 auto-load
    v.playsInline = true;
    v.crossOrigin = 'anonymous';
    v.preload     = 'auto';
    v.setAttribute('webkit-playsinline', '');
    v.load();                      // 立即觸發網路請求，開始緩衝
    return v;
  }

  // ══════════════════════════════════════════════════════════
  //  AR Pipeline Module
  // ══════════════════════════════════════════════════════════
  function createARModule() {
    let video, texture, group;

    // [改進 #3] 並發鎖：防止 imagefound/imagelost 快速連發造成 playing 狀態錯亂
    let playing = false;
    let playLock = false;

    async function setPlayback(shouldPlay) {
      if (playLock) return;          // 有操作進行中，直接忽略重複呼叫
      playLock = true;
      try {
        if (shouldPlay) {
          if (video.readyState < 2) {
            await new Promise(r => video.addEventListener('loadeddata', r, { once: true }));
          }
          // [改進 #1] 解除 muted 限制（使用者手勢已完成）
          video.muted = false;
          await video.play();
          playing = true;
          UI.playBtn.textContent = '⏸ 暫停';
        } else {
          video.pause();
          playing = false;
          UI.playBtn.textContent = '▶ 播放';
        }
      } catch(e) {
        console.warn('[AR] setPlayback failed:', e);
      } finally {
        playLock = false;            // 無論成敗，釋放鎖
      }
    }

    function syncRenderer() {
      const { renderer, camera } = XR8.Threejs.xrScene();
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.domElement.style.cssText =
        'position:fixed!important;inset:0!important;' +
        'width:100vw!important;height:100vh!important;' +
        'z-index:0!important;object-fit:cover!important;';
      if (camera) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
    }

    return {
      name: 'ar-video-module',

      onStart() {
        const { scene, renderer } = XR8.Threejs.xrScene();
        renderer.autoClear = false;
        syncRenderer();

        window.addEventListener('resize', syncRenderer);
        window.addEventListener('orientationchange', () => setTimeout(syncRenderer, 300));

        scene.add(new THREE.AmbientLight(0xffffff, 1));

        // [改進 #1] 重用頁面 load 時預先建立的 video 元素，避免重新下載
        if (earlyVideo) {
          video = earlyVideo;
          earlyVideo = null;
          // warm-up 已在背景完成，不需重做
        } else {
          // fallback：earlyVideo 不知何故未建立
          video = document.createElement('video');
          video.src         = AR_CONFIG.videoSrc;
          video.loop        = true;
          video.muted       = true;
          video.playsInline = true;
          video.crossOrigin = 'anonymous';
          video.preload     = 'auto';
          video.setAttribute('webkit-playsinline', '');
          video.load();
        }

        // [改進 #4] warm-up：play 再 pause，讓解碼器提前初始化
        // 使用旗標防止與正式播放競速
        let warmedUp = false;
        video.addEventListener('canplaythrough', async () => {
          if (warmedUp || playing) return;   // 若已 warm 過或已在正式播放，跳過
          warmedUp = true;
          try {
            await video.play();
            await wait(80);
            if (!playing) { video.pause(); video.currentTime = 0; }
          } catch(e) {}
        }, { once: true });

        // [改進 #5] 使用 RGBFormat 取代 RGBAFormat，影片無 alpha 通道
        texture = new THREE.VideoTexture(video);
        texture.minFilter = texture.magFilter = THREE.LinearFilter;
        texture.format = THREE.RGBFormat;   // 省去無意義的 alpha 通道轉換

        const pw = AR_CONFIG.videoPlaneWidth;
        const ph = pw * (AR_CONFIG.videoAspect.h / AR_CONFIG.videoAspect.w);
        group = new THREE.Group();
        group.visible = false;
        group.add(new THREE.Mesh(
          new THREE.PlaneGeometry(pw, ph),
          new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, toneMapped: false })
        ));
        scene.add(group);

        UI.playBtn.onclick = () => setPlayback(!playing);

        // [改進 #6] 處理頁面切到背景再回來：iOS 有機率讓影片靜默失效
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            // 切出去：強制暫停，釋放解碼資源
            if (playing) video.pause();
          } else {
            // 回來：若先前在播放中，重新觸發
            if (playing) video.play().catch(() => {});
          }
        });
      },

      // [改進 #7] onUpdate 只在實際播放時才標記 needsUpdate，避免浪費 GPU 上傳
      onUpdate() {
        if (playing && texture && video.readyState >= 2) {
          texture.needsUpdate = true;
        }
      },

      listeners: [
        {
          event: 'reality.imagefound',
          async process({ detail }) {
            group.position.copy(detail.position);
            group.quaternion.copy(detail.rotation);
            group.scale.setScalar(detail.scale);
            group.visible = true;
            UI.scan.classList.add('hidden');
            UI.ctrl.classList.add('show');
            await setPlayback(true);
          }
        },
        {
          event: 'reality.imageupdated',
          process({ detail }) {
            if (!group.visible) return;
            group.position.copy(detail.position);
            group.quaternion.copy(detail.rotation);
            group.scale.setScalar(detail.scale);
          }
        },
        {
          event: 'reality.imagelost',
          async process() {
            group.visible = false;
            UI.scan.classList.remove('hidden');
            UI.ctrl.classList.remove('show');
            await setPlayback(false);
          }
        }
      ]
    };
  }

  // ══════════════════════════════════════════════════════════
  //  啟動流程
  // ══════════════════════════════════════════════════════════

  async function preloadTargets() {
    const result = [];
    for (const path of AR_CONFIG.targetJsonPaths) {
      try {
        const r = await fetch(path);
        result.push(await r.json());
      } catch(e) { console.error('[AR] target 載入失敗:', e); }
    }
    STATE.targets = result;
  }

  async function reqPermissions() {
    for (const Ev of [DeviceMotionEvent, DeviceOrientationEvent]) {
      if (typeof Ev?.requestPermission === 'function') {
        try { await Ev.requestPermission(); } catch(e) {}
      }
    }
  }

  async function startXR8() {
    const ok = await Promise.all([
      waitUntil(() => STATE.targets !== null),
      waitUntil(() => STATE.xrReady)
    ]);
    if (!ok[0] || !ok[1] || !STATE.targets.length) {
      UI.loader.textContent = '載入失敗，請確認 HTTPS / 相機權限 / 網路';
      return;
    }

    XR8.XrController.configure({
      disableWorldTracking: true,
      imageTargetData: STATE.targets
    });

    XR8.addCameraPipelineModules([
      XR8.GlTextureRenderer.pipelineModule(),
      XR8.Threejs.pipelineModule(),
      XR8.XrController.pipelineModule(),
      createARModule()
    ]);

    XR8.run({ canvas: UI.canvas });
  }

  async function boot() {
    if (STATE.booted) return;
    STATE.booted = true;

    UI.loader.classList.add('on');
    await reqPermissions();

    UI.tap.style.opacity = '0';
    setTimeout(() => { UI.tap.style.display = 'none'; }, 700);

    await startXR8();
  }

  window.addEventListener('xrloaded', () => { STATE.xrReady = true; });

  UI.tap.addEventListener('touchend', e => { e.preventDefault(); boot(); }, { passive: false });
  UI.tap.addEventListener('click', boot);

  window.addEventListener('xrerror', ({ detail }) => {
    console.error('[AR] xrerror:', detail);
    UI.scan.querySelector('#scan-label').textContent = '❌ AR 錯誤，請重新整理';
  });

  // [改進 #1] 頁面 load 後同時執行：預載 JSON + 建立 video 元素（開始緩衝）
  window.addEventListener('load', () => {
    preloadTargets();
    earlyVideo = createEarlyVideo();
  });
  </script>
</body>
</html>
